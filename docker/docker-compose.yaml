services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: newlens_api
    ports:
      - "8099:8099"
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys;\n\ntry:\n    urllib.request.urlopen('http://localhost:8099/', timeout=10)\nexcept Exception as e:\n    sys.exit(1)\n\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    volumes:
      - ../Dataset:/app/Dataset:ro
  
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: newlens_app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8099
    env_file:
      - ../.env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: newlens
