# Docker Compose for NewLens - Backend AI Engine
# Only runs the FastAPI service to maximize efficiency.
# Frontend is expected to be run locally by the user.

services:
  news-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: newlens_backend_api
    ports:
      - "8000:8000"
    volumes:
      # Mount project root for backend logic
      - ..:/app
      # Cache HuggingFace models strictly in your D: drive folder
      - ../Models/huggingface_cache:/app/Models/huggingface_cache
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - HF_HOME=/app/Models/huggingface_cache
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    # Add a healthcheck to ensure API is ready
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').getcode()" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: newlens_network
